services:
  - type: web
    name: veil-of-ages-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @veil-of-ages/api
    startCommand: npm run start --workspace @veil-of-ages/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: LINK_TTL_MINUTES
        value: 10
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: SONG_TEXT_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
